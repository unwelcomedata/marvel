project_name: "marvel"

paths:
  data_raw:       data/raw        # downloaded source files, never modified
  data_interim:   data/interim    # intermediate cleaned/joined tables
  data_processed: data/processed  # final analysis-ready tables
  export:         export          # sellable dataset packages (csv, xlsx, parquet)
  outputs:        outputs         # chart images (exploratory)
  outputs_social: outputs/social  # publication-ready social media charts
  notebooks:      notebooks

settings:
  encoding: utf-8
  parquet_engine: pyarrow
  duckdb_file: data/project.duckdb   # single file DB for the project

sources:
  # The Numbers — Marvel Cinematic Universe franchise box-office history.
  # ONE page carries every MCU film's production budget, opening weekend,
  # DOMESTIC lifetime gross, and WORLDWIDE lifetime gross, plus release date.
  # This is the primary source: it gives worldwide-per-film in a single table,
  # which Box Office Mojo's franchise page does not (BOM franchise = domestic
  # only). NOMINAL (year-of-release) dollars. Fun-tier project → an
  # industry/fan box-office aggregator is an acceptable, plainly-cited source.
  # Static-fetchable (no JS). The table lists unreleased films with $0 grosses
  # (Blade, Doomsday, Secret Wars, etc.) and a TV special (Werewolf by Night) —
  # these are filtered out in cleaning (theatrical, released-only universe).
  tnumbers_mcu:
    url: "https://www.the-numbers.com/movies/franchise/Marvel-Cinematic-Universe"
    type: html_table
    table_index: 0
    js_render: false
    rate_limit_seconds: 1.5

  # Box Office Mojo — Marvel Cinematic Universe franchise page. DOMESTIC lifetime
  # gross per film (+ max theaters, opening, release date, distributor). Used as
  # a cross-check on The Numbers' domestic figures and to confirm the film roster
  # / distributors. Includes re-release and "Columbia 100th Anniversary" rows
  # that are filtered out in cleaning. NOMINAL dollars. Static-fetchable.
  bom_mcu:
    url: "https://www.boxofficemojo.com/franchise/fr541495045/"
    type: html_table
    table_index: 0
    js_render: false
    rate_limit_seconds: 1.5

  # Phase / Saga groupings are NOT scraped — they are a small factual reference
  # table hand-built in 01-ingest from the films themselves (Marvel Studios'
  # official Phase announcements). Boundaries used:
  #   Infinity Saga  = Phase 1 (2008-2012), Phase 2 (2013-2015), Phase 3 (2016-2019)
  #   Multiverse Saga = Phase 4 (2021-2022), Phase 5 (2023-2025), Phase 6 (2025- )
  # See SOURCES.md for the per-film assignment and citations.

export:
  formats:
    - csv
    - xlsx
    - parquet
  include_codebook: true       # generate a column-description markdown alongside each export
  strip_pii_columns: []        # list column names to drop before packaging
